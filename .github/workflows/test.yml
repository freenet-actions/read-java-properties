name: Test
on: pull_request
defaults:
  run:
    shell: bash
env:
  ENV_VAR_PREFIX: PROP_TEST__
  JSON_OUTPUT_FILE: tmp/out.json
  SELECTED_SINGLE_KEY: 'org.gradle.jvmargs'
  SELECTED_KEYS: 'sourceJavaVersion org.gradle.jvmargs unicode_escapes colon:in:Key'
  SELECTED_SINGLE_NAME: 'my/prop'
  SELECTED_NAMES: 'java-version jvm_args unicode colon'

  NOT_FOUND_STATUS: 54
  SHELL_SETUP: |-
    assertEquals() {
      if [ "$1" = "$2" ]; then
        printf 'ok: "%s" == "%s"\n' "$1" "$2" >&2
      else
        printf 'assertion error: "%s" != "%s"\n' "$1" "$2" | tee >(od --width=1000 --address-radix=n --format=c >&2)
        return 1
      fi
    }

    # Queries a value by calling command $1 with the remaining args and expects it to exit with status $NOT_FOUND_STATUS.
    assertUndefined() {
      local getterFunction=$1; shift
      local value st
      if value="$("$getterFunction" "$@")"; then
        printf 'assertion error: %s == "%s", expected undefined\n' "$*" "$value" >&2
        return 1
      elif [ ${st-$?} -eq "$NOT_FOUND_STATUS" ]; then
        printf 'ok: %s is undefined\n' "$*" >&2
      else
        # no error message, assuming failed $getterFunction has already written one
        return $st
      fi
    }

    # The following helper functions to get a value for a given property key from the result have a uniform
    # API (property key as sole argument) so that the actual test code can be identical (and thereby reusable
    # with YAML anchors) for different result types. This leads to some assumptions which might seem
    # a little odd, like the JSON result file must be called $JSON_OUTPUT_FILE.

    # Expects JSON as stdin and extracts the value for key $1.
    getJsonValue() {
      local key=$1; shift
      jq --arg k "$key" --raw-output '.[$k] // halt_error(env.NOT_FOUND_STATUS | tonumber)'
    }

    # Expects JSON in variable RESULT_JSON and extracts the value for key $1.
    getEnvJsonValue() {
      getJsonValue "$@" <<<"$RESULT_JSON"
    }

    # Expects JSON in variable RESULT_JSON and extracts the value for key <output-style encoding of $1>.
    encodeKeyAndGetEnvJsonValue() {
      local key=$1; shift
      local encodedKey
      encodedKey="_$(perl -pe 's=((?!_)[[:punct:]])= sprintf("-%04X", ord($1)) =ge' <<<"$key")"
      getEnvJsonValue "$encodedKey"
    }

    # Prints the value of the environment variable set for key $1 (when not using a prefix).
    getEnv() {
      local key=$1; shift
      local st
      if printenv -- "$key"; then
        : # OK
      elif [ ${st-$?} -eq 1 ]; then
        return $NOT_FOUND_STATUS
      else
        # no error message, assuming printenv has already written one
        return $st
      fi
    }

    # Prints the value of the environment variable set for key $1 when using a prefix.
    getEnvWithPrefix() {
      local key=$1; shift
      getEnv "${ENV_VAR_PREFIX}${key}" "$@"
    }

    getFileJsonValue() {
      getJsonValue "$@" <"$JSON_OUTPUT_FILE"
    }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - &checkoutStep
      name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    ############################################################
    - name: 'test (should fail): invalid input: resultType'
      id: error-input-resultType
      continue-on-error: true
      uses: ./
      with:
        file: test/resources/test.properties
        resultType: rt1
    - name: 'validate "test (should fail): invalid input: resultType"'
      run: |-
        eval "$SHELL_SETUP"
        assertEquals '${{steps.error-input-resultType.outcome}}' failure

    ############################################################
    - name: 'test (should fail): resultType "output-named" without names'
      id: error-resultType-output-without-names
      continue-on-error: true
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}}'
        resultType: 'output-named:'
    - name: 'validate "test (should fail): resultType "output-named" without names"'
      run: |-
        eval "$SHELL_SETUP"
        assertEquals '${{steps.error-resultType-output-without-names.outcome}}' failure

    ############################################################
    - name: 'test (should fail): resultType "env-named" without names'
      id: error-resultType-env-without-names
      continue-on-error: true
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}}'
        resultType: 'env-named:'
    - name: 'validate "test (should fail): resultType "env-named" without names"'
      run: |-
        eval "$SHELL_SETUP"
        assertEquals '${{steps.error-resultType-env-without-names.outcome}}' failure

    ############################################################
    - name: 'test (should fail): resultType "output-named" without keys'
      id: error-resultType-output-without-keys
      continue-on-error: true
      uses: ./
      with:
        file: test/resources/test.properties
        resultType: 'output-named:a b'
    - name: 'validate "test (should fail): resultType "output-named" without keys"'
      run: |-
        eval "$SHELL_SETUP"
        assertEquals '${{steps.error-resultType-output-without-keys.outcome}}' failure

    ############################################################
    - name: 'test (should fail): resultType "env-named" without keys'
      id: error-resultType-env-without-keys
      continue-on-error: true
      uses: ./
      with:
        file: test/resources/test.properties
        resultType: 'env-named:a b'
    - name: 'validate "test (should fail): resultType "env-named" without keys"'
      run: |-
        eval "$SHELL_SETUP"
        assertEquals '${{steps.error-resultType-env-without-keys.outcome}}' failure

    ############################################################
    # This tests a subset of test case multi-output, but with hard-coded encoding from property key to output
    # name (instead of re-implemented).
    # It also demonstrates how you'd usually use outputs with one environment variable per output.
    - name: 'test: query multiple properties as action outputs (simple)'
      id: multi-output-simple
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}} dash-in-Key'
    - name: 'validate "test: query multiple properties as action outputs (simple)"'
      env:
        RESULT_SJV:     ${{steps.multi-output-simple.outputs._sourceJavaVersion}}
        RESULT_JVMARGS: ${{steps.multi-output-simple.outputs._org-002Egradle-002Ejvmargs}}
        RESULT_COLONK:  ${{steps.multi-output-simple.outputs._colon-003Ain-003AKey}}
        RESULT_DASHK:   ${{steps.multi-output-simple.outputs._dash-002Din-002DKey}}
        RESULT_UNI:     ${{steps.multi-output-simple.outputs._unicode_escapes}}
      run: |-
        eval "$SHELL_SETUP"
        assertEquals "$RESULT_SJV"     '21'
        assertEquals "$RESULT_JVMARGS" '-ea -showversion'
        assertEquals "$RESULT_COLONK"  'c'
        assertEquals "$RESULT_DASHK"   'd'
        assertEquals "$RESULT_UNI"     'a«,»c'

    ############################################################
    - name: 'test: query all properties as action outputs'
      id: all-output
      uses: ./
      with:
        file: test/resources/test.properties
    - name: 'validate "test: query all properties as action outputs"'
      env:
        RESULT_JSON: ${{toJSON(steps.all-output.outputs)}}
        RESULT_GETTER: encodeKeyAndGetEnvJsonValue
      run: &validateAllImpl |-
        eval "$SHELL_SETUP"
        assertEquals "$($RESULT_GETTER sourceJavaVersion )" '21'
        assertEquals "$($RESULT_GETTER targetJavaVersion )" '17'
        assertEquals "$($RESULT_GETTER org.gradle.jvmargs)" '-ea -showversion'
        assertEquals "$($RESULT_GETTER colon:in:Key      )" 'c'
        assertEquals "$($RESULT_GETTER colonInValue      )" 'cv:'
        assertEquals "$($RESULT_GETTER dash-in-Key       )" 'd'
        assertEquals "$($RESULT_GETTER dashInValue       )" 'd-'
        assertEquals "$($RESULT_GETTER empty             )" ''
        assertEquals "$($RESULT_GETTER null              )" 'null'
        # Expect additional linefeed (the usual output of commands, e.g. jq);
        # add a trailing dummy char to preserve the otherwise trailing linefeed in bash command substitution [https://stackoverflow.com/a/15184414]:
        assertEquals "$($RESULT_GETTER whitespace_escapes && printf '|')" $'A\tB\fC C\nD\n\n|'
        assertEquals "$($RESULT_GETTER unicode_escapes   )" 'a«,»c'
        assertEquals "$($RESULT_GETTER dash_1            )" '-'
        assertEquals "$($RESULT_GETTER dash_2            )" '--'
        assertEquals "$($RESULT_GETTER dash_3            )" '---'
        assertEquals "$($RESULT_GETTER dash_4            )" '----'
        assertEquals "$($RESULT_GETTER dash_5            )" '-----'
        assertEquals "$($RESULT_GETTER dash_6            )" '------'
        assertEquals "$($RESULT_GETTER dash_7            )" '-------'
        assertEquals "$($RESULT_GETTER dash_8            )" '--------'
        assertEquals "$($RESULT_GETTER dash_9            )" '---------'
        assertEquals "$($RESULT_GETTER dash_10           )" '----------'
        assertEquals "$($RESULT_GETTER dash_11           )" '-----------'
        assertEquals "$($RESULT_GETTER dash_12           )" '------------'
        assertEquals "$($RESULT_GETTER dash_3_4_1        )" $'---\n----\n-'
        assertEquals "$($RESULT_GETTER dash_3_4_8_1      )" $'---\n----\n--------\n-'

    ############################################################
    - name: 'test: query multiple properties as action outputs'
      id: multi-output
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}}'
    - name: 'validate "test: query multiple properties as action outputs"'
      env:
        RESULT_JSON: ${{toJSON(steps.multi-output.outputs)}}
        RESULT_GETTER: encodeKeyAndGetEnvJsonValue
      run: &validateMultiImpl |-
        eval "$SHELL_SETUP"
        assertEquals "$($RESULT_GETTER sourceJavaVersion )" '21'
        assertEquals "$($RESULT_GETTER org.gradle.jvmargs)" '-ea -showversion'
        assertEquals "$($RESULT_GETTER colon:in:Key      )" 'c'
        assertEquals "$($RESULT_GETTER unicode_escapes   )" 'a«,»c'

        assertUndefined $RESULT_GETTER targetJavaVersion
        assertUndefined $RESULT_GETTER colonInValue
        assertUndefined $RESULT_GETTER dash-in-Key
        assertUndefined $RESULT_GETTER dashInValue
        assertUndefined $RESULT_GETTER empty
        assertUndefined $RESULT_GETTER null
        assertUndefined $RESULT_GETTER whitespace_escapes
        assertUndefined $RESULT_GETTER dash_1
        assertUndefined $RESULT_GETTER dash_2
        assertUndefined $RESULT_GETTER dash_3
        assertUndefined $RESULT_GETTER dash_4
        assertUndefined $RESULT_GETTER dash_5
        assertUndefined $RESULT_GETTER dash_6
        assertUndefined $RESULT_GETTER dash_7
        assertUndefined $RESULT_GETTER dash_8
        assertUndefined $RESULT_GETTER dash_9
        assertUndefined $RESULT_GETTER dash_10
        assertUndefined $RESULT_GETTER dash_11
        assertUndefined $RESULT_GETTER dash_12
        assertUndefined $RESULT_GETTER dash_3_4_1
        assertUndefined $RESULT_GETTER dash_3_4_8_1

    ############################################################
    - name: 'test: query multiple properties as action outputs of given names'
      id: multi-output-named
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}}'
        resultType: 'output-named:${{env.SELECTED_NAMES}}'
    - name: 'validate "test: query multiple properties as action outputs of given names"'
      env:
        RESULT_JSON: ${{toJSON(steps.multi-output-named.outputs)}}
        # Output names specified as input are also subject to encoding (prefix "_", replace punctuation except "_"):
        RESULT_GETTER: encodeKeyAndGetEnvJsonValue
      run: &validateMultiNamedImpl |-
        eval "$SHELL_SETUP"
        assertEquals "$($RESULT_GETTER java-version)" '21'
        assertEquals "$($RESULT_GETTER jvm_args    )" '-ea -showversion'
        assertEquals "$($RESULT_GETTER colon       )" 'c'
        assertEquals "$($RESULT_GETTER unicode     )" 'a«,»c'

        # The outputs with the default names are not set:
        assertUndefined $RESULT_GETTER sourceJavaVersion
        assertUndefined $RESULT_GETTER org.gradle.jvmargs
        assertUndefined $RESULT_GETTER colon:in:Key
        assertUndefined $RESULT_GETTER unicode_escapes

        # Outputs for non-selected keys are not set, for example:
        assertUndefined $RESULT_GETTER colon:in:Key
        assertUndefined $RESULT_GETTER colonInValue
        assertUndefined $RESULT_GETTER dash_1

    ############################################################
    - name: 'test: query multiple properties as action outputs of given name'
      id: multi-output-named1
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}}'
        resultType: 'output-named:${{env.SELECTED_SINGLE_NAME}}'
    - name: 'validate "test: query multiple properties as action outputs of given name"'
      env:
        RESULT_JSON: ${{toJSON(steps.multi-output-named1.outputs)}}
        # Output names specified as input are also subject to encoding (prefix "_", replace punctuation except "_"):
        RESULT_GETTER: encodeKeyAndGetEnvJsonValue
      run: &validateMultiNamed1Impl |-
        eval "$SHELL_SETUP"
        assertEquals "$($RESULT_GETTER my/prop)" 'c'

        # The outputs with the default names are not set:
        assertUndefined $RESULT_GETTER sourceJavaVersion
        assertUndefined $RESULT_GETTER org.gradle.jvmargs
        assertUndefined $RESULT_GETTER colon:in:Key
        assertUndefined $RESULT_GETTER unicode_escapes

        # Outputs for non-selected keys are not set, for example:
        assertUndefined $RESULT_GETTER colon:in:Key
        assertUndefined $RESULT_GETTER colonInValue
        assertUndefined $RESULT_GETTER dash_1

    ############################################################
    - name: 'test: query single property as action outputs'
      id: single-output
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_SINGLE_KEY}}'
    - name: 'validate "test: query multiple properties as action outputs"'
      env:
        RESULT_JSON: ${{toJSON(steps.single-output.outputs)}}
        RESULT_GETTER: encodeKeyAndGetEnvJsonValue
      run: &validateSingleImpl |-
        eval "$SHELL_SETUP"
        assertEquals "$($RESULT_GETTER org.gradle.jvmargs)" '-ea -showversion'

        assertUndefined $RESULT_GETTER sourceJavaVersion
        assertUndefined $RESULT_GETTER targetJavaVersion
        assertUndefined $RESULT_GETTER colon:in:Key
        assertUndefined $RESULT_GETTER colonInValue
        assertUndefined $RESULT_GETTER dash-in-Key
        assertUndefined $RESULT_GETTER dashInValue
        assertUndefined $RESULT_GETTER empty
        assertUndefined $RESULT_GETTER null
        assertUndefined $RESULT_GETTER whitespace_escapes
        assertUndefined $RESULT_GETTER unicode_escapes
        assertUndefined $RESULT_GETTER dash_1
        assertUndefined $RESULT_GETTER dash_2
        assertUndefined $RESULT_GETTER dash_3
        assertUndefined $RESULT_GETTER dash_4
        assertUndefined $RESULT_GETTER dash_5
        assertUndefined $RESULT_GETTER dash_6
        assertUndefined $RESULT_GETTER dash_7
        assertUndefined $RESULT_GETTER dash_8
        assertUndefined $RESULT_GETTER dash_9
        assertUndefined $RESULT_GETTER dash_10
        assertUndefined $RESULT_GETTER dash_11
        assertUndefined $RESULT_GETTER dash_12
        assertUndefined $RESULT_GETTER dash_3_4_1
        assertUndefined $RESULT_GETTER dash_3_4_8_1

    ############################################################
    - name: 'test: query all properties as JSON action output'
      id: all-json
      uses: ./
      with:
        file: test/resources/test.properties
        resultType: json
    - name: 'validate "test: query all properties as JSON action output"'
      env:
        RESULT_JSON: ${{steps.all-json.outputs.json}}
        RESULT_GETTER: encodeKeyAndGetEnvJsonValue
      run: *validateAllImpl

    ############################################################
    - name: 'test: query multiple properties as JSON action output'
      id: multiple-json
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}}'
        resultType: json
    - name: 'validate "test: query multiple properties as JSON action output"'
      env:
        RESULT_JSON: ${{steps.multiple-json.outputs.json}}
      run: *validateMultiImpl

    ############################################################
    - name: 'test: query all properties as JSON file'
      uses: ./
      with:
        file: test/resources/test.properties
        resultType: 'json-file:${{env.JSON_OUTPUT_FILE}}'
    - name: 'validate "test: query all properties as JSON file"'
      env:
        RESULT_GETTER: getFileJsonValue
      run: *validateAllImpl

    ############################################################
    - name: 'test: query multiple properties as JSON file'
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}}'
        resultType: 'json-file:${{env.JSON_OUTPUT_FILE}}'
    - name: 'validate "test: query multiple properties as JSON file"'
      env:
        RESULT_GETTER: getFileJsonValue
      run: *validateMultiImpl


  # Each test which sets environment variables is a separate job to be independant of other tests.
  ############################################################
  test-all-env:
    runs-on: ubuntu-latest
    steps:
    - *checkoutStep
    - name: 'test: query all properties as environment variables'
      uses: ./
      with:
        file: test/resources/test.properties
        resultType: env
    - name: 'validate "test: query all properties as environment variables"'
      env:
        RESULT_GETTER: getEnv
      run: *validateAllImpl

  ############################################################
  test-multi-env:
    runs-on: ubuntu-latest
    steps:
    - *checkoutStep
    - name: 'test: query multiple properties as environment variables'
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}}'
        resultType: env
    - name: 'validate "test: query multiple properties as environment variables"'
      env:
        RESULT_GETTER: getEnv
      run: *validateMultiImpl

  ############################################################
  test-multi-env-named:
    runs-on: ubuntu-latest
    steps:
    - *checkoutStep
    - name: 'test: query multiple properties as environment variables of given names'
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}}'
        resultType: 'env-named:${{env.SELECTED_NAMES}}'
    - name: 'validate "test: query multiple properties as environment variables of given names"'
      env:
        RESULT_GETTER: getEnv
      run: *validateMultiNamedImpl

  ############################################################
  test-multi-env-named1:
    runs-on: ubuntu-latest
    steps:
    - *checkoutStep
    - name: 'test: query multiple properties as environment variables of given names'
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_SINGLE_KEY}}'
        resultType: 'env-named:${{env.SELECTED_NAMES}}'
    - name: 'validate "test: query multiple properties as environment variables of given names"'
      env:
        RESULT_GETTER: getEnv
      run: *validateMultiNamed1Impl

  ############################################################
  test-single-env:
    runs-on: ubuntu-latest
    steps:
    - *checkoutStep
    - name: 'test: query single property as environment variable'
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_SINGLE_KEY}}'
        resultType: env
    - name: 'validate "test: query single property as environment variable"'
      env:
        RESULT_GETTER: getEnv
      run: *validateSingleImpl

  ############################################################
  test-all-env-with-prefix:
    runs-on: ubuntu-latest
    steps:
    - *checkoutStep
    - name: 'test: query all properties as environment variables with prefix'
      uses: ./
      with:
        file: test/resources/test.properties
        resultType: env
    - name: 'validate "test: query all properties as environment variables"'
      env:
        RESULT_GETTER: getEnvWithPrefix
      run: *validateAllImpl

  ############################################################
  test-multi-env-with-prefix:
    runs-on: ubuntu-latest
    steps:
    - *checkoutStep
    - name: 'test: query multiple properties as environment variables with prefix'
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_KEYS}}'
        resultType: env
    - name: 'validate "test: query multiple properties as environment variables with prefix"'
      env:
        RESULT_GETTER: getEnvWithPrefix
      run: *validateMultiImpl

  ############################################################
  test-single-env-with-prefix:
    runs-on: ubuntu-latest
    steps:
    - *checkoutStep
    - name: 'test: query single property as environment variable with prefix'
      uses: ./
      with:
        file: test/resources/test.properties
        keys: '${{env.SELECTED_SINGLE_KEY}}'
        resultType: env
    - name: 'validate "test: query single property as environment variable with prefix"'
      env:
        RESULT_GETTER: getEnvWithPrefix
      run: *validateSingleImpl
